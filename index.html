<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bora Charts</title>
<style>
:root{--bg:#0b0e14;--panel:#131722;--line:#2a2e39;--ink:#d1d4dc;--mute:#787b86;--acc:#2962ff;--up:#089981}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:16px;margin-right:6px}.logo b{color:var(--acc)}
input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;font-size:15px;width:190px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;min-height:34px}
button:hover{border-color:var(--mute)}button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grp{display:flex;gap:4px;flex-wrap:wrap}
.chips{display:flex;gap:4px;overflow-x:auto;flex:1 1 300px;scrollbar-width:thin}.chips button{flex:none}
.tape{height:46px;border-bottom:1px solid var(--line)}
main{flex:1;display:flex;min-height:0}
#grid{flex:1;display:grid;gap:4px;padding:4px;min-height:0}
#grid.l1{grid-template:1fr/1fr}#grid.l2{grid-template:1fr/1fr 1fr}#grid.l4{grid-template:1fr 1fr/1fr 1fr}#grid.l6{grid-template:1fr 1fr/1fr 1fr 1fr}
.cell{position:relative;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.cell.act{border-color:var(--acc)}
.cell .bar{font-size:12px;color:var(--mute);padding:3px 8px;cursor:pointer;display:flex;justify-content:space-between}
.cell.act .bar{color:#fff;background:var(--acc)}
.cell .w{flex:1;min-height:0}
aside{width:360px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
aside.hide{display:none}
.tabs{display:flex;gap:4px;padding:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#side{flex:1;min-height:0}
.tradingview-widget-container{height:100%;width:100%}
.tradingview-widget-container__widget{height:100%;width:100%}
#warn{display:none;position:fixed;inset:auto 10px 10px 10px;z-index:9;background:#f23645;color:#fff;padding:12px 14px;border-radius:8px;font-size:14px}
.note{font-size:11px;color:var(--mute);padding:4px 10px}
@media(max-width:900px){header{gap:6px;padding:6px}.logo{display:none}#lay button[data-n="6"]{display:none}.chips{flex-basis:100%}main{flex-direction:column;overflow-y:auto}#grid{min-height:70vh;flex:none}#grid.l2,#grid.l4,#grid.l6{grid-template-columns:1fr;grid-auto-rows:60vh;grid-template-rows:none}aside{width:100%;height:80vh;flex:none;border-left:0;border-top:1px solid var(--line)}input{width:140px}}
</style>
</head>
<body>
<header>
  <div class="logo">Bora<b>Charts</b></div>
  <form id="f"><input id="q" placeholder="Sembol: BTCUSDT, THYAO, AAPL" autocomplete="off"></form>
  <div class="grp" id="lay"></div>
  <div class="chips" id="chips"></div>
  <button id="tog">Panel</button>
</header>
<div class="tape" id="tape"></div>
<main>
  <div id="grid"></div>
  <aside id="as">
    <div class="tabs" id="tabs"></div>
    <div id="side"></div>
    <div class="note">Veriler TradingView'den canlı gelir. Grafiğin üst çubuğuna tıklayıp seçin, sonra sembol değiştirin.</div>
  </aside>
</main>
<div id="warn">Grafikler yüklenemedi. Bu sayfa Claude içindeki önizlemede çalışmaz, Chrome gibi gerçek bir tarayıcıda açılmalı.</div>
<script>
{
const TV='https://s3.tradingview.com/external-embedding/embed-widget-';
const QUICK=[['BTC','BINANCE:BTCUSDT'],['ETH','BINANCE:ETHUSDT'],['SOL','BINANCE:SOLUSDT'],['XRP','BINANCE:XRPUSDT'],['BIST100','BIST:XU100'],['THYAO','BIST:THYAO'],['ASELS','BIST:ASELS'],['USD/TRY','FX:USDTRY'],['Altın','OANDA:XAUUSD'],['S&P500','FOREXCOM:SPXUSD'],['NASDAQ','NASDAQ:NDX'],['AAPL','NASDAQ:AAPL'],['TSLA','NASDAQ:TSLA'],['NVDA','NASDAQ:NVDA']];
const DEF=['BINANCE:BTCUSDT','BINANCE:ETHUSDT','BIST:XU100','OANDA:XAUUSD','NASDAQ:NVDA','FX:USDTRY'];
let st={layout:4,syms:DEF.slice(),ints:['60','60','60','60','60','60'],active:0,tab:'izle',side:true};
try{Object.assign(st,JSON.parse(localStorage.getItem('boracharts')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('boracharts',JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);

function widget(el,name,cfg){
  el.innerHTML='';
  const c=document.createElement('div');c.className='tradingview-widget-container';
  const w=document.createElement('div');w.className='tradingview-widget-container__widget';
  const s=document.createElement('script');s.src=TV+name+'.js';s.async=true;s.type='text/javascript';
  s.text=JSON.stringify(cfg);
  c.append(w,s);el.append(c);
}
const base={colorTheme:'dark',isTransparent:true,locale:'tr',width:'100%',height:'100%'};

function chart(i){
  const cell=$('grid').children[i];if(!cell)return;
  cell.querySelector('.bar span').textContent=st.syms[i];
  widget(cell.querySelector('.w'),'advanced-chart',{autosize:true,symbol:st.syms[i],interval:st.ints[i]||'60',timezone:'Europe/Istanbul',theme:'dark',style:'1',locale:'tr',allow_symbol_change:true,hide_side_toolbar:false,withdateranges:true,details:i===0&&st.layout===1,calendar:false,save_image:true,support_host:'https://www.tradingview.com'});
}
function grid(){
  const g=$('grid');g.className='l'+st.layout;
  g.innerHTML=Array.from({length:st.layout},(_,i)=>`<div class="cell${i===st.active?' act':''}"><div class="bar" data-i="${i}"><span></span><em>${i+1}</em></div><div class="w"></div></div>`).join('');
  for(let i=0;i<st.layout;i++)chart(i);
}
function setActive(i){st.active=i;[...$('grid').children].forEach((c,k)=>c.classList.toggle('act',k===i));save()}
function setSym(sym){
  sym=sym.trim().toUpperCase();if(!sym)return;
  if(!sym.includes(':')){if(/USDT$|BUSD$|USDC$/.test(sym))sym='BINANCE:'+sym;else if(/^[A-Z]{5}$/.test(sym)&&!/^[A-Z]{3}(TRY|USD|EUR)$/.test(sym))sym='BIST:'+sym}
  if(st.active>=st.layout)st.active=0;
  st.syms[st.active]=sym;save();chart(st.active);side();
}

$('lay').innerHTML=[1,2,4,6].map(n=>`<button data-n="${n}">${n} grafik</button>`).join('');
const layBtns=()=>[...$('lay').children].forEach(b=>b.classList.toggle('on',+b.dataset.n===st.layout));
$('lay').onclick=e=>{const n=+e.target.dataset.n;if(!n)return;st.layout=n;if(st.active>=n)st.active=0;save();layBtns();grid()};
$('chips').innerHTML=QUICK.map(([t,s])=>`<button data-s="${s}">${t}</button>`).join('');
$('chips').onclick=e=>{if(e.target.dataset.s)setSym(e.target.dataset.s)};
$('f').onsubmit=e=>{e.preventDefault();setSym($('q').value);$('q').value=''};
$('grid').onclick=e=>{const b=e.target.closest('.bar');if(b)setActive(+b.dataset.i)};

const TABS={
  izle:['İzleme',()=>['market-overview',{...base,dateRange:'1D',showChart:true,showSymbolLogo:true,showFloatingTooltip:true,tabs:[
    {title:'Kripto',symbols:[['BINANCE:BTCUSDT','Bitcoin'],['BINANCE:ETHUSDT','Ethereum'],['BINANCE:SOLUSDT','Solana'],['BINANCE:BNBUSDT','BNB'],['BINANCE:XRPUSDT','XRP'],['BINANCE:DOGEUSDT','Dogecoin']].map(([s,d])=>({s,d}))},
    {title:'BIST',symbols:[['BIST:XU100','BIST 100'],['BIST:THYAO','THY'],['BIST:ASELS','Aselsan'],['BIST:GARAN','Garanti'],['BIST:KCHOL','Koç'],['BIST:TUPRS','Tüpraş']].map(([s,d])=>({s,d}))},
    {title:'ABD',symbols:[['FOREXCOM:SPXUSD','S&P 500'],['NASDAQ:NDX','Nasdaq 100'],['NASDAQ:AAPL','Apple'],['NASDAQ:NVDA','Nvidia'],['NASDAQ:TSLA','Tesla'],['NASDAQ:MSFT','Microsoft']].map(([s,d])=>({s,d}))},
    {title:'Döviz/Emtia',symbols:[['FX:USDTRY','USD/TRY'],['FX:EURTRY','EUR/TRY'],['FX:EURUSD','EUR/USD'],['OANDA:XAUUSD','Altın'],['OANDA:XAGUSD','Gümüş'],['TVC:UKOIL','Brent']].map(([s,d])=>({s,d}))}]}]],
  teknik:['Teknik',()=>['technical-analysis',{...base,interval:'1h',showIntervalTabs:true,displayMode:'multiple',symbol:st.syms[st.active]||DEF[0]}]],
  tarayici:['Tarayıcı',()=>['screener',{...base,defaultColumn:'overview',defaultScreen:'general',market:'crypto',showToolbar:true,screener_type:'crypto_mkt',displayCurrency:'USD'}]],
  bist:['BIST',()=>['screener',{...base,defaultColumn:'overview',defaultScreen:'most_capitalized',market:'turkey',showToolbar:true}]],
  isi:['Isı haritası',()=>['crypto-coins-heatmap',{...base,dataSource:'Crypto',blockSize:'market_cap_calc',blockColor:'change',symbolUrl:'',hasTopBar:true,isDataSetEnabled:true,isZoomEnabled:true,hasSymbolTooltip:true}]],
  takvim:['Takvim',()=>['events',{...base,importanceFilter:'0,1',countryFilter:'us,eu,tr,gb,cn,jp'}]],
  haber:['Haberler',()=>['timeline',{...base,feedMode:'symbol',symbol:st.syms[st.active]||DEF[0],displayMode:'regular'}]]
};
$('tabs').innerHTML=Object.entries(TABS).map(([k,[t]])=>`<button data-t="${k}">${t}</button>`).join('');
function side(){
  if(!TABS[st.tab])st.tab='izle';
  [...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===st.tab));
  const [n,c]=TABS[st.tab][1]();widget($('side'),n,c);
}
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;st.tab=t;save();side()};
const sideVis=()=>{$('as').classList.toggle('hide',!st.side);$('tog').classList.toggle('on',st.side)};
$('tog').onclick=()=>{st.side=!st.side;save();sideVis()};

widget($('tape'),'ticker-tape',{colorTheme:'dark',isTransparent:true,displayMode:'adaptive',showSymbolLogo:true,locale:'tr',symbols:QUICK.map(([t,s])=>({proName:s,title:t}))});
try{if(matchMedia('(max-width:900px)').matches&&!localStorage.getItem('boracharts'))st.layout=1}catch(e){}
layBtns();sideVis();grid();side();
setTimeout(()=>{if(!document.querySelector('#grid iframe'))$('warn').style.display='block'},8000);
}
</script>
</body>
</html>
